<style>
/* ============================================================
   GALAXY CLASS SCHEDULE
   ตัวอักษร  Chakra Petch (หัวเรื่อง/ข้อมูล) + IBM Plex Sans Thai (เนื้อความ)
             ทั้งคู่รองรับไทย-ละตินด้วยโครงเดียวกัน
   โครงสร้าง รางเวลาเส้นเดียวเป็นแกน  ไม่มีกรอบกล่อง
   3 ระดับ   สัปดาห์+รูป / สัปดาห์ชิป / อะเจนดารายวัน — ไม่มี scroll แนวนอน
   ธีม       มืด (ค่าเริ่มต้น) / สว่าง — auto ตามระบบ ปุ่มสลับ override ได้ จำค่าไว้
   พิมพ์      @media print บังคับพื้นสว่างเสมอ ตัดรูปออก A4 แนวนอน
   ============================================================ */
:root{
  /* ---------- โทนมืด (ค่าเริ่มต้น) ---------- */
  --void:#0B0A16;        --void-rgb:11,10,22;
  --panel:#15122A;
  --panel-2:#1E1A38;
  --edge:rgba(255,255,255,.10);
  --edge-2:rgba(255,255,255,.18);
  --text:#F4F1FF;
  --muted:#A69CD0;
  --plasma:#B44BFF;         /* สีเน้น 1/2 ประจำสาขา — แก้ตรงนี้เวลาทำสาขาใหม่ ห้ามให้ค่าซ้ำกับสาขาอื่น */
  --ion:#35E0D8;            /* สีเน้น 2/2 ประจำสาขา — คู่กับ --plasma ด้านบน */
  --rail:rgba(180,75,255,.35);
  --r:14px;
  --shadow:rgba(0,0,0,.45);
  --wordmark-grad:linear-gradient(100deg,#fff 8%,#E6D4FF 38%,var(--plasma) 72%,var(--ion) 100%);
  --aurora-bg:
    radial-gradient(760px 300px at 76% 4%, rgba(180,75,255,.30), transparent 68%),
    radial-gradient(620px 280px at 12% 12%, rgba(53,224,216,.16), transparent 70%),
    url('../assets/bg/galaxy.jpg') center 22% / cover no-repeat;

  /* สีประจำหมวดคลาส — พาสเทล ไว้เด่นบนพื้นมืด */
  --c-yoga:#8FA0E8; --c-cycle:#6E8FC9; --c-pump:#E8926F; --c-combat:#D08A4E;
  --c-dance:#A97FE0; --c-zumba:#E3B84A; --c-kid:#5FB0E0; --c-fly:#3FC6C0;
  --c-step:#9B8AD6; --c-pil:#D79A7A; --c-power:#C77FBE;
}

/* ---------- โทนสว่าง ----------
   สองกรณีต้องใช้ค่าเดียวกัน จึงประกาศไว้ในตัวแปรกลาง --light-tokens ไม่ได้ (CSS ไม่รองรับ)
   เลยเขียนซ้ำสองที่: (1) ระบบตั้งสว่างไว้และผู้ใช้ยังไม่เคยกดสลับเอง [auto]
                        (2) ผู้ใช้กดสลับเป็นสว่างเอง [data-theme="light"] ชนะเสมอไม่ว่าระบบตั้งอะไรไว้
   สีหมวดคลาสเข้มขึ้นกว่าฝั่งมืด เพราะข้อความสีอ่อนบนพื้นขาวอ่านไม่ออก */
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){
    --void:#F7F5FC;        --void-rgb:247,245,252;
    --panel:#FFFFFF;
    --panel-2:#ECE7FA;
    --edge:rgba(28,24,48,.12);
    --edge-2:rgba(28,24,48,.24);
    --text:#1C1830;
    --muted:#5B5480;
    --plasma:#8A2BE2;
    --ion:#0C8F89;
    --rail:rgba(138,43,226,.28);
    --shadow:rgba(28,24,48,.16);
    --wordmark-grad:linear-gradient(100deg,var(--text) 4%,var(--plasma) 55%,var(--ion) 100%);
    --aurora-bg:
      radial-gradient(760px 300px at 76% 4%, rgba(138,43,226,.10), transparent 70%),
      radial-gradient(620px 280px at 12% 12%, rgba(12,143,137,.09), transparent 72%);

    --c-yoga:#3E56B8; --c-cycle:#2F5590; --c-pump:#C1522A; --c-combat:#96591A;
    --c-dance:#6B3FB0; --c-zumba:#8A6100; --c-kid:#1D6FA8; --c-fly:#0E7F79;
    --c-step:#5B4AA0; --c-pil:#9C5936; --c-power:#96368A;
  }
  html:not([data-theme="dark"]):not([data-theme="light"]){color-scheme:light}
}
[data-theme="light"]{
  --void:#F7F5FC;        --void-rgb:247,245,252;
  --panel:#FFFFFF;
  --panel-2:#ECE7FA;
  --edge:rgba(28,24,48,.12);
  --edge-2:rgba(28,24,48,.24);
  --text:#1C1830;
  --muted:#5B5480;
  --plasma:#8A2BE2;
  --ion:#0C8F89;
  --rail:rgba(138,43,226,.28);
  --shadow:rgba(28,24,48,.16);
  --wordmark-grad:linear-gradient(100deg,var(--text) 4%,var(--plasma) 55%,var(--ion) 100%);
  --aurora-bg:
    radial-gradient(760px 300px at 76% 4%, rgba(138,43,226,.10), transparent 70%),
    radial-gradient(620px 280px at 12% 12%, rgba(12,143,137,.09), transparent 72%);

  --c-yoga:#3E56B8; --c-cycle:#2F5590; --c-pump:#C1522A; --c-combat:#96591A;
  --c-dance:#6B3FB0; --c-zumba:#8A6100; --c-kid:#1D6FA8; --c-fly:#0E7F79;
  --c-step:#5B4AA0; --c-pil:#9C5936; --c-power:#96368A;
}

*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{
  font-family:'IBM Plex Sans Thai','Chakra Petch',system-ui,sans-serif;
  background:var(--void);color:var(--text);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:rgba(53,224,216,.22);
  overflow-x:hidden;
  transition:background-color .25s ease,color .25s ease;
}
h1,h2,.num{font-family:'Chakra Petch','IBM Plex Sans Thai',sans-serif}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

:where(a,button,[tabindex]):focus-visible{
  outline:2px solid var(--ion);outline-offset:3px;border-radius:6px;
}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
.skip{
  position:fixed;top:-100px;left:12px;z-index:60;
  background:var(--ion);color:#04201E;padding:10px 18px;border-radius:0 0 8px 8px;
  font-weight:600;text-decoration:none;transition:top .18s ease;
}
.skip:focus{top:0}

/* ---------- เปลือกหน้า ---------- */
.app{
  max-width:1240px;margin:0 auto;position:relative;
  padding:0 clamp(16px,4vw,40px) 0;
  padding-left:max(clamp(16px,4vw,40px),env(safe-area-inset-left));
  padding-right:max(clamp(16px,4vw,40px),env(safe-area-inset-right));
}
.aurora{
  position:absolute;inset:0 0 auto;height:640px;z-index:-1;pointer-events:none;
  background:var(--aurora-bg);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.45) 58%,transparent 100%);
  mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.45) 58%,transparent 100%);
  opacity:.85;
}

/* ---------- หัวเรื่อง ---------- */
.top{padding:clamp(38px,7vw,72px) 0 26px;text-align:center}
.wordmark{
  font-weight:700;font-size:clamp(40px,8vw,84px);line-height:1;
  letter-spacing:.10em;padding-left:.10em;
  background:var(--wordmark-grad);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.wordmark small{
  display:block;font-size:clamp(11px,1.6vw,15px);font-weight:500;
  letter-spacing:.42em;padding-left:.42em;margin-top:12px;
  color:var(--muted);-webkit-text-fill-color:var(--muted);
}
.month{
  margin-top:14px;font-family:'Chakra Petch',sans-serif;
  font-size:13px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;
}
/* ป้ายสาขา — ตัวระบุว่าลิงก์นี้เป็นของสาขาไหน */
.branch{
  display:inline-flex;align-items:center;gap:7px;margin-top:16px;
  padding:7px 16px 7px 12px;border-radius:999px;
  background:rgba(53,224,216,.10);border:1px solid rgba(53,224,216,.38);
  font-size:13px;font-weight:500;color:var(--ion);letter-spacing:.02em;
}
.branch svg{width:14px;height:14px;flex:none}

/* ---------- แถบควบคุม ---------- */
.controls{
  position:sticky;top:0;z-index:40;
  margin:22px 0 0;padding:12px 0;
  background:linear-gradient(180deg,rgba(var(--void-rgb),.92),rgba(var(--void-rgb),.72));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--edge);
}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.row + .row{margin-top:10px}

/* ปุ่มอรรถประโยชน์ — สลับธีม / ดาวน์โหลด PDF */
.util-btn{
  display:inline-flex;align-items:center;gap:7px;
  font:600 12px/1 'Chakra Petch',sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text);background:var(--panel);border:1px solid var(--edge);border-radius:999px;
  padding:9px 16px;cursor:pointer;touch-action:manipulation;
  transition:border-color .2s ease,background-color .2s ease,transform .2s ease;
}
.util-btn:hover{border-color:var(--edge-2);transform:translateY(-1px)}
.util-btn svg{width:15px;height:15px;flex:none}

.studios{
  display:inline-flex;gap:4px;padding:4px;
  background:var(--panel);border:1px solid var(--edge);border-radius:999px;
}
.studio{
  font:600 13px/1 'Chakra Petch',sans-serif;letter-spacing:.10em;text-transform:uppercase;
  color:var(--muted);background:transparent;border:0;border-radius:999px;
  padding:10px 20px;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  transition:color .2s ease,background-color .2s ease;
}
.studio:hover{color:var(--text);background:rgba(128,128,128,.12)}
.studio[aria-selected="true"]{
  color:#0B0A16;background:linear-gradient(100deg,var(--plasma),var(--ion));
}

.days{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.day{
  font:500 12px/1 'Chakra Petch',sans-serif;letter-spacing:.10em;text-transform:uppercase;
  color:var(--muted);background:transparent;
  border:1px solid var(--edge);border-radius:999px;
  padding:8px 14px;cursor:pointer;touch-action:manipulation;
  transition:color .2s ease,border-color .2s ease,background-color .2s ease;
}
.day:hover{color:var(--text);border-color:var(--edge-2)}
.day[aria-pressed="true"]{
  color:var(--ion);border-color:var(--ion);background:rgba(53,224,216,.10);
}

/* ---------- ตารางสัปดาห์ ---------- */
.board{padding:26px 0 56px}
.sched{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:6px}
.sched td,.sched th{padding:0;vertical-align:top}
.sched thead th{
  vertical-align:middle;text-align:center;
  font:600 12px/1 'Chakra Petch',sans-serif;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);padding:0 0 10px;
}
.col-time{width:70px}
.sched.big .col-time{width:88px}

/* รางเวลา: เส้นเดียวยาวลงมา มีหมุดทุกคาบ */
.slot-time{
  position:relative;vertical-align:middle;text-align:right;
  padding:0 16px 0 0 !important;
  font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:13px;
  font-variant-numeric:tabular-nums;color:var(--text);line-height:1.5;
}
.slot-time::before{
  content:"";position:absolute;top:0;bottom:0;right:5px;width:1px;background:var(--rail);
}
.slot-time::after{
  content:"";position:absolute;top:50%;right:1px;width:9px;height:9px;margin-top:-4.5px;
  border-radius:50%;background:var(--plasma);box-shadow:0 0 0 4px rgba(180,75,255,.16);
}
.slot-time .to{display:block;font-weight:500;color:var(--muted);font-size:12px}

/* ---------- การ์ดคลาส ---------- */
.card{
  height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease,background-color .25s ease;
}
.card:hover{
  transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 60%,transparent);
  box-shadow:0 14px 34px var(--shadow);
}
.thumb{position:relative;width:100%;aspect-ratio:16/10;display:grid;place-items:center;background:var(--panel-2)}
.thumb svg{width:38%;height:38%;opacity:.5}
.thumb .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 45%,rgba(11,10,22,.72) 100%);
}
.meta{padding:10px 12px 12px;border-top:2px solid var(--accent)}
.name{
  font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:12.5px;
  line-height:1.3;letter-spacing:.02em;text-transform:uppercase;
  overflow-wrap:anywhere;text-wrap:balance;
}
.by{display:block;margin-top:3px;font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.tt{
  display:block;margin-bottom:4px;font-family:'Chakra Petch',sans-serif;
  font-size:10.5px;letter-spacing:.08em;color:var(--accent);
  font-variant-numeric:tabular-nums;
}

/* สีประจำหมวดคลาส */
.k-yoga{--accent:var(--c-yoga)}   .k-cycle{--accent:var(--c-cycle)}
.k-pump{--accent:var(--c-pump)}   .k-combat{--accent:var(--c-combat)}
.k-dance{--accent:var(--c-dance)} .k-zumba{--accent:var(--c-zumba)}
.k-kid{--accent:var(--c-kid)}     .k-fly{--accent:var(--c-fly)}
.k-step{--accent:var(--c-step)}   .k-pil{--accent:var(--c-pil)}
.k-power{--accent:var(--c-power)}

/* ---------- อะเจนดารายวัน ---------- */
.agenda{list-style:none;max-width:720px;margin:0 auto}
.agenda li{display:grid;grid-template-columns:78px 1fr;gap:18px;padding-bottom:22px}
.agenda .slot-time{
  position:relative;text-align:right;padding:2px 16px 0 0 !important;font-size:14px;
}
.agenda .stack{display:flex;flex-direction:column;gap:10px}
.agenda .card{flex-direction:row;height:auto}
.agenda .thumb{width:104px;flex:0 0 104px;aspect-ratio:1}
.agenda .meta{
  flex:1;border-top:0;border-left:2px solid var(--accent);
  display:flex;flex-direction:column;justify-content:center;padding:12px 14px;
}
.agenda .name{font-size:14px}
.agenda .by{font-size:12.5px}
.empty{
  grid-column:2;color:var(--muted);font-size:14px;padding:14px 0;
}

/* ---------- คำอธิบายศัพท์ ---------- */
.legend{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:12px 32px;padding:0 0 56px;font-size:14px;line-height:1.6;
}
.legend div{display:flex;gap:.6em;align-items:baseline}
.legend dt{
  font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.10em;color:var(--ion);white-space:nowrap;
}
.legend dd{color:var(--muted)}
footer{
  border-top:1px solid var(--edge);padding:22px 0 calc(28px + env(safe-area-inset-bottom));
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);text-align:center;font-family:'Chakra Petch',sans-serif;
}

/* ---------- ระดับที่ 2: สัปดาห์แบบชิป (ตัดรูปออก) ---------- */
@media (max-width:1039px){
  .sched .thumb{display:none}
  .meta{border-top:0;border-left:3px solid var(--accent);padding:9px 10px}
  .card{border-radius:10px}
  .name{font-size:11.5px}
  .by{font-size:11px}
  .col-time{width:56px}
  .slot-time{font-size:12px;padding-right:12px !important}
  .sched{border-spacing:5px}
}

/* ---------- ระดับที่ 3: อะเจนดา (จัดการด้วย JS ด้วย) ---------- */
@media (max-width:640px){
  .top{padding-top:34px}
  .controls{padding:10px 0}
  .agenda li{grid-template-columns:64px 1fr;gap:12px}
  .agenda .thumb{width:82px;flex:0 0 82px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
}

/* ============================================================
   พิมพ์ / ส่งออก PDF
   บังคับพื้นสว่างเสมอไม่ว่าจอจะตั้งธีมไหนไว้ — ประหยัดหมึกและอ่านง่ายบนกระดาษ
   ตัดรูปถ่ายออกทั้งหมด (คือของหนักสุดของหน้านี้) เหลือแต่ตารางข้อความ
   จึงได้ PDF ขนาดเล็ก สร้างไว จ่าหน้าลงกระดาษ A4 แนวนอนได้พอดี
   ============================================================ */
@media print{
  @page{ size:A4 landscape; margin:10mm; }

  :root, [data-theme]{
    --void:#ffffff;        --void-rgb:255,255,255;
    --panel:#ffffff;
    --panel-2:#f4f4f7;
    --edge:#d7d7de;
    --edge-2:#b7b7c2;
    --text:#141225;
    --muted:#4a4560;
    --plasma:#7a2fd0;
    --ion:#0b7d77;
    --rail:#c9c9d6;
    --shadow:transparent;
    --r:6px;

    --c-yoga:#3E56B8; --c-cycle:#2F5590; --c-pump:#C1522A; --c-combat:#96591A;
    --c-dance:#6B3FB0; --c-zumba:#8A6100; --c-kid:#1D6FA8; --c-fly:#0E7F79;
    --c-step:#5B4AA0; --c-pil:#9C5936; --c-power:#96368A;
  }

  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .skip, .controls, .aurora{display:none !important}
  .app{max-width:none;padding:0}

  /* หัวเรื่องบีบเหลือบรรทัดเดียว — ของเดิม 4 บรรทัดกินพื้นที่จนดันแถวท้ายตารางล้นไปหน้า 2 */
  .top{
    padding:0 0 6px;display:flex;align-items:baseline;justify-content:center;
    gap:10px;flex-wrap:wrap;text-align:left;
  }
  .wordmark{
    font-size:17px;line-height:1;letter-spacing:.08em;padding-left:.08em;text-shadow:none;
    background:none !important;-webkit-text-fill-color:var(--text) !important;color:var(--text) !important;
  }
  .wordmark small{display:none}                 /* "Class Schedule" — ซ้ำกับหัวข้อ ตัดทิ้งเพื่อประหยัดพื้นที่ */
  .month{margin-top:0;color:var(--muted);font-size:9px;letter-spacing:.14em}
  .branch{
    margin-top:0;padding:2px 9px 2px 7px;background:none;
    border:1px solid var(--edge-2);color:var(--text);font-size:9px;
  }
  .branch svg{width:10px;height:10px}

  /* ของหนักสุดของหน้า — ตัดออกตอนพิมพ์เพื่อไฟล์เล็กและประหยัดหมึก */
  .thumb{display:none !important}

  .board{padding:6px 0 0}
  .sched{border-spacing:2px}
  .sched thead th{font-size:8.5px;letter-spacing:.08em;padding-bottom:2px}
  thead{display:table-header-group}   /* ขึ้นหัวตารางซ้ำทุกหน้าถ้าล้นหน้าเดียว */
  tr{page-break-inside:avoid}

  .card{border:1px solid var(--edge);box-shadow:none;border-radius:var(--r)}
  .card:hover{transform:none;box-shadow:none;border-color:var(--edge)}
  .meta{padding:3px 5px;border-top:2px solid var(--accent)}
  .name{font-size:8.5px;letter-spacing:0;line-height:1.15}
  .by{font-size:7.5px;margin-top:1px;line-height:1.1}
  .tt{font-size:7px;margin-bottom:1px;line-height:1.1}
  .slot-time{font-size:9px;padding:0 5px 0 0 !important}
  .slot-time .to{font-size:8px}
  .slot-time::before,.slot-time::after{display:none}  /* หมุด/รางเวลาเป็นของตกแต่งจอ ตัดทิ้งตอนพิมพ์ */
  .col-time{width:46px}

  /* บังคับการ์ดใหญ่ (Cycling) ให้กลับมาขนาดพิมพ์ปกติ */
  .sched.big .meta{padding:3px 5px}
  .sched.big .name{font-size:8.5px}
  .sched.big .slot-time{font-size:9px}
  .sched.big .col-time{width:46px}

  .legend{font-size:9px;padding:6px 0 4px;gap:4px 20px}
  .legend dt{font-size:9px;color:var(--ion)}
  footer{font-size:7.5px;padding:5px 0;border-top:1px solid var(--edge)}
}
</style>
</head>
<body>
<a class="skip" href="#schedule">ข้ามไปที่ตารางคลาส</a>

<div class="app">
  <div class="aurora"></div>

  <header class="top">
    <h1 class="wordmark" translate="no">GALAXY<small>Class Schedule</small></h1>
    <p class="month num">September 2026</p>
    <p><span class="branch" id="branch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
      </svg>
    </span></p>
  </header>

  <div class="controls">
    <div class="row">
      <button type="button" class="util-btn" id="themeToggle" aria-pressed="false"></button>
      <button type="button" class="util-btn" id="printBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2"/>
          <rect x="6" y="14" width="12" height="7"/>
        </svg>
        ดาวน์โหลด PDF
      </button>
      <button type="button" class="util-btn" id="jpgBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        บันทึก JPG
      </button>
    </div>
    <div class="row">
      <div class="studios" id="studios" role="tablist" aria-label="เลือกสตูดิโอ"></div>
    </div>
    <div class="row">
      <div class="days" id="days" role="group" aria-label="กรองตามวัน"></div>

  <main class="board" id="schedule" aria-live="polite">
    <table class="sched" id="sched" hidden>
      <caption class="sr-only" id="caption"></caption>

      <tbody id="tbody"></tbody>
    </table>
    <ol class="agenda" id="agenda" hidden></ol>
  </main>

  <dl class="legend" id="legend"></dl>
  <footer id="foot"></footer>
</div>

<script>
/* ============================================================
   ไอคอนสำรอง แสดงเมื่อยังไม่มีรูปถ่ายของคลาสนั้น
   ============================================================ */
const S = (p) => '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + p + '</svg>';
const ICON = {
  yoga:  S('<circle cx="32" cy="13" r="5"/><path d="M32 19v14M32 33l-13 12M32 33l13 12M19 27h26"/>'),
  cycle: S('<circle cx="16" cy="45" r="10"/><circle cx="48" cy="45" r="10"/><path d="M16 45l9-19h10l7 19M25 26h13M38 26l6 8"/><circle cx="41" cy="16" r="4"/>'),
  pump:  S('<path d="M10 26v12M16 22v20M48 22v20M54 26v12M16 32h32"/>'),
  combat:S('<circle cx="32" cy="12" r="5"/><path d="M32 18v16l12 6M32 26L18 32M26 34l-4 18M38 40l4 12"/>'),
  dance: S('<circle cx="34" cy="11" r="5"/><path d="M34 17l-4 14 10 8-4 14M30 31l-12-4M40 39l10-6"/>'),
  zumba: S('<circle cx="30" cy="12" r="5"/><path d="M30 18v13l-8 9 2 12M30 31l10 7 2 13M22 24l-8 6M38 24l10-6"/>'),
  kid:   S('<circle cx="32" cy="14" r="6"/><path d="M32 20v16M20 26h24M24 52l8-16 8 16"/>'),
  fly:   S('<path d="M8 12h48M22 12v10a10 10 0 0 0 20 0V12"/><circle cx="32" cy="38" r="5"/><path d="M32 43l-8 11M32 43l8 11"/>'),
  step:  S('<path d="M8 46h16V34h16V22h16"/><path d="M8 52h48"/>'),
  pil:   S('<circle cx="20" cy="20" r="5"/><path d="M20 26l10 8h16M30 34l-6 14M8 48h48"/>'),
  power: S('<path d="M34 6L16 36h14l-4 22 20-32H32z"/>'),
  rpm:   S('<circle cx="32" cy="32" r="18"/><path d="M32 32l10-8M32 14v6M50 32h-6M32 50v-6M14 32h6"/>')
};
function art(name){
  const n = name.toUpperCase();
  if(n.indexOf('RPM') > -1)        return ['cycle','rpm'];
  if(n.indexOf('CYCLING') > -1)    return ['cycle','cycle'];
  if(n.indexOf('YOGA') > -1)       return ['yoga','yoga'];
  if(n.indexOf('FLY') > -1)        return ['fly','fly'];
  if(n.indexOf('KID') > -1)        return ['kid','kid'];
  if(n.indexOf('ZUMBA') > -1)      return ['zumba','zumba'];
  if(n.indexOf('FIGHT') > -1 || n.indexOf('BOXING') > -1 || n.indexOf('COMBAT') > -1) return ['combat','combat'];
  if(n.indexOf('PUMP') > -1)       return ['pump','pump'];
  if(n.indexOf('STEP') > -1 || n.indexOf('EASY MOVE') > -1) return ['step','step'];
  if(n.indexOf('K-POP') > -1 || n.indexOf('KPOP') > -1 || n.indexOf('DANCE') > -1) return ['dance','dance'];
  if(n.indexOf('POWER') > -1)      return ['power','power'];
  if(n.indexOf('STRENGTH') > -1)   return ['power','power'];
  return ['pil','pil'];
}

/* ============================================================
   หารูป ลองนามสกุลตามลำดับ ไม่เจอเลยก็ถอยไปใช้ไอคอน
   ============================================================ */
const IMG_EXT = ['jpg','jpeg','png','webp','svg'];
const slug = (s) => s.toLowerCase().replace(/&/g,' ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
function mountPhoto(img){
  let i = 0;
  const base = img.dataset.base;
  img.addEventListener('error', function(){
    i += 1;
    if(i >= IMG_EXT.length){ img.remove(); return; }
    img.src = base + '.' + IMG_EXT[i];
  });
  img.src = base + '.' + IMG_EXT[0];
}

/* ============================================================
   ข้อมูลตาราง
   ============================================================ */
const D = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const c = (name,by,tt,img) => ({name:name, by:by, tt:tt, img:img});

const STUDIOS = {
  cycling:{
    label:'Cycling', title:'Galaxy Cycling Studio', folder:'cycling',
    days:['Mon','Tue','Wed','Thu'], big:true,
    rows:[
      ['10.00','10.50',{Thu:c('CYCLING','BENZ')}],
      ['11.00','11.50',{Mon:c('CYCLING','SANTA')}],
      ['18.30','19.20',{Tue:c('CYCLING','BENZ'),Wed:c('RPM','JAY')}]
    ]
  },
  studio1:{
    label:'Studio 1', title:'Galaxy Studio 1', folder:'studio1', days:D,
    rows:[
      ['08.00','08.50',{Mon:c('YOGA BASIC','NOI'),Tue:c('YOGA BASIC','TAEW'),Thu:c('YOGA BASIC','NOI'),Sat:c('YOGA BALANCE & POWER','TAEW')}],
      ['09.00','09.50',{Tue:c('BODY COMBAT','PRITES'),Wed:c('GALAXY FLY','PANG'),Thu:c('ZUMBA','BIG'),Fri:c('BODY PUMP','SANTA'),Sat:c('ZUMBA','BIG')}],
      ['10.00','10.50',{Mon:c('EASY STEP','SANTA'),Tue:c('BODY PUMP','SANTA'),Wed:c('BODY PUMP','KHANOMPANG'),Thu:c('KID BOOTCAMP'),Fri:c('EASY MOVE','SANTA'),Sat:c('INTERMEDIATE STEP','NOTE'),Sun:c('BODY PUMP','BENZ')}],
      ['11.00','11.50',{Mon:c('GALAXY DANCE','BIG'),Tue:c('KID BOOTCAMP'),Fri:c('YOGA BASIC','NAM'),Sat:c('BODY COMBAT','NOTE')}],
      ['12.00','12.50',{Sun:c('KID BOOTCAMP')}],
      ['13.00','13.50',{Sat:c('KID BOOTCAMP')}],
      ['16.30','17.20',{Wed:c('KID BOOTCAMP'),Thu:c('BODY PUMP','BALL','17.00 – 17.50'),Sat:c('KID BOOTCAMP')}],
      ['17.30','18.20',{Mon:c('GALAXY FLY','PANG'),Tue:c('YOGA','BARBIE'),Thu:c('BODY COMBAT','BALL','18.00 – 18.50'),Sat:c('YOGA BASIC','NAM','18.00 – 18.50')}],
      ['18.30','19.20',{Mon:c('BODY COMBAT','KHANOM PANG'),Tue:c('YOGA','BARBIE'),Wed:c('INTERMEDIATE STEP','NOTE'),Fri:c('GALAXY FLY','NOK'),Sun:c('GALAXY DANCE','BIG')}],
      ['19.30','20.20',{Mon:c('BODY PUMP','KHANOM PANG'),Tue:c('BODY PUMP','BENZ'),Wed:c('BODY COMBAT','NOTE'),Fri:c('BODY PUMP','BALL')}],
      ['20.30','21.20',{Mon:c('GALAXY DANCE','MOMO'),Wed:c('RETRO DANCE','BIG'),Fri:c('ZUMBA','BIG')}]
    ]
  },
  pilates:{
    label:'Pilates', title:'Galaxy Pilates Studio', folder:'pilates', days:D,
    rows:[
      ['09.00','09.50',{Tue:c('BASIC','KED'),Fri:c('POWER','JEW'),Sat:c('FLEXIBLE','POOM'),Sun:c('STRENGTH','JIB')}],
      ['10.00','10.50',{Mon:c('AAG','NHING'),Tue:c('FLEXIBLE','KED'),Wed:c('FLEXIBLE','PANG'),Thu:c('AAG','DA'),Fri:c('BASIC','JEW'),Sat:c('BASIC','POOM'),Sun:c('BEGINNER','JIB')}],
      ['11.00','11.50',{Mon:c('FLEXIBLE','NHING'),Wed:c('AAG','PANG'),Thu:c('FLEXIBLE','DA')}],
      ['17.30','18.20',{Tue:c('STRENGTH','DA')}],
      ['18.30','19.20',{Mon:c('STRENGTH','PANG'),Tue:c('FLEXIBLE','DA'),Wed:c('BASIC','VOON'),Thu:c('FLEXIBLE','KED'),Fri:c('POWER','JEW'),Sat:c('POWER','JEW'),Sun:c('STRENGTH','JEW')}],
      ['19.30','20.20',{Mon:c('AAG','PANG'),Tue:c('AAG','DA'),Wed:c('FLEXIBLE','VOON'),Thu:c('STRENGTH','KED'),Fri:c('AAG','JEW'),Sat:c('FLEXIBLE','JEW'),Sun:c('POWER','JEW')}]
    ],
    legend:[
      ['AAG','เน้น ๆ ARM AB GLUTES'],
      ['BEGINNER','ออกกำลังกายสำหรับมือใหม่ ที่รู้วิธีการใช้เครื่องแล้ว'],
      ['FLEXIBLE','ยืดหยุ่น กลาง ๆ ไม่หนัก ไม่เบา'],
      ['BASIC','แนะนำการใช้อุปกรณ์ และการออกกำลังกายเบื้องต้น'],
      ['STRENGTH','เน้นความแข็งแรง']
    ]
  }
};
const KEYS = Object.keys(STUDIOS);
const MONTH = 'September 2026';

/* ============================================================
   สาขา — ทำสาขาใหม่โดยแก้แค่บล็อกนี้บล็อกเดียว
   (อย่าลืมแก้ <title> กับ og: ใน <head> ให้ตรงกันด้วย)
   ============================================================ */
const BRANCH = { key:'bangna', name:'สาขาบางนา', nameEn:'Bangna' };

const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let studio = 'studio1';
let day = 'all';                                   /* 'all' หรือชื่อวัน */
const narrow = window.matchMedia('(max-width: 640px)');

/* ------------------------------------------------------------
   ชิ้นส่วนการ์ด ใช้ร่วมกันทั้งมุมมองสัปดาห์และอะเจนดา
   ------------------------------------------------------------ */
function cardHTML(k, folder, big, eager){
  const a = art(k.name), fam = a[0], ic = a[1];
  const base = '../assets/images/' + folder + '/' + (k.img || slug(k.name));
  const dims = big ? ' width="800" height="600"' : ' width="640" height="400"';
  return '<article class="card k-' + fam + '">' +
           '<div class="thumb">' + ICON[ic] +
             '<img class="photo" alt="" decoding="async"' + dims +
                  ' data-base="' + esc(base) + '"' +
                  (eager ? ' fetchpriority="high"' : ' loading="lazy"') + '>' +
           '</div>' +
           '<div class="meta">' +
             (k.tt ? '<span class="tt">' + esc(k.tt) + '</span>' : '') +
             '<span class="name">' + esc(k.name) + '</span>' +
             (k.by ? '<span class="by">by ' + esc(k.by) + '</span>' : '') +
           '</div>' +
         '</article>';
}

/* ------------------------------------------------------------
   มุมมองสัปดาห์ — ตารางจริง กว้างพอดีจอเสมอ
   ------------------------------------------------------------ */
function renderWeek(s){
  const table = el('sched');
  table.className = 'sched' + (s.big ? ' big' : '');
  el('caption').textContent = 'ตารางคลาส ' + s.title + ' ' + BRANCH.name + ' ประจำเดือน ' + MONTH;

  el('cols').innerHTML = '<col class="col-time">' +
    s.days.map(function(){ return '<col>'; }).join('');

  el('thead').innerHTML = '<tr><th scope="col"><span class="sr-only">เวลา</span></th>' +
    s.days.map(function(d){ return '<th scope="col">' + d + '</th>'; }).join('') + '</tr>';

  el('tbody').innerHTML = s.rows.map(function(row, i){
    return '<tr><th scope="row" class="slot-time num">' + row[0] +
             (row[1] ? '<span class="to">' + row[1] + '</span>' : '') + '</th>' +
           s.days.map(function(d){
             const k = row[2][d];
             return '<td>' + (k ? cardHTML(k, s.folder, s.big, i === 0) : '') + '</td>';
           }).join('') +
         '</tr>';
  }).join('');

  el('tbody').querySelectorAll('img.photo').forEach(mountPhoto);
  el('agenda').innerHTML = '';            /* ล้างมุมมองที่ไม่ได้ใช้ ไม่ให้รูปค้างใน DOM */
  el('agenda').hidden = true;
  el('sched').hidden = false;
}

/* ------------------------------------------------------------
   มุมมองรายวัน — รางเวลาเป็นแกนกลาง
   ------------------------------------------------------------ */
function renderDay(s, d){
  const items = s.rows.filter(function(row){ return row[2][d]; });
  el('agenda').innerHTML = items.length
    ? items.map(function(row, i){
        return '<li><p class="slot-time num">' + row[0] +
                 (row[1] ? '<span class="to">' + row[1] + '</span>' : '') + '</p>' +
               '<div class="stack">' + cardHTML(row[2][d], s.folder, s.big, i === 0) + '</div></li>';
      }).join('')
    : '<li><p class="slot-time num">—</p><p class="empty">วัน' + d + ' ไม่มีคลาสที่ ' + esc(s.title) + '</p></li>';

  el('agenda').querySelectorAll('img.photo').forEach(mountPhoto);
  el('tbody').innerHTML = '';             /* ล้างมุมมองที่ไม่ได้ใช้ ไม่ให้รูปค้างใน DOM */
  el('sched').hidden = true;
  el('agenda').hidden = false;
}

/* ------------------------------------------------------------
   วาดหน้า
   ------------------------------------------------------------ */
function render(push){
  const s = STUDIOS[studio];

  /* สตูดิโอ Cycling มีแค่ จ.–พฤ. วันที่เลือกไว้อาจไม่มีอยู่ */
  const activeDay = (day !== 'all' && s.days.indexOf(day) > -1) ? day : 'all';
  const useDay = narrow.matches ? (activeDay === 'all' ? s.days[0] : activeDay) : activeDay;

  if(useDay === 'all') renderWeek(s); else renderDay(s, useDay);

  /* ปุ่มวัน สร้างใหม่ตามสตูดิโอ เพราะจำนวนวันไม่เท่ากัน */
  el('days').innerHTML = ['all'].concat(s.days).map(function(d){
    const on = (d === useDay) || (d === 'all' && useDay === 'all');
    return '<button type="button" class="day" data-day="' + d + '" aria-pressed="' + on + '">' +
           (d === 'all' ? 'ทั้งสัปดาห์' : d) + '</button>';
  }).join('');

  Array.prototype.forEach.call(el('studios').children, function(t){
    const on = t.dataset.k === studio;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.tabIndex = on ? 0 : -1;
  });

  const lg = s.legend || [];
  el('legend').innerHTML = lg.map(function(x){
    return '<div><dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd></div>';
  }).join('');
  el('legend').hidden = lg.length === 0;

  el('foot').textContent = 'Galaxy ' + BRANCH.name + ' · ' + s.title + ' · ' + MONTH;
  document.title = 'GALAXY ' + BRANCH.name + ' — ' + s.title + ' ' + MONTH;

  if(push){
    const q = '?studio=' + studio + (activeDay === 'all' ? '' : '&day=' + activeDay);
    history.pushState({studio:studio, day:activeDay}, '', q);
  }
}

/* ---------- แท็บสตูดิโอ ---------- */
KEYS.forEach(function(k){
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'studio'; b.id = 'studio-' + k;
  b.dataset.k = k; b.textContent = STUDIOS[k].label;
  b.setAttribute('role','tab'); b.setAttribute('aria-selected','false');
  b.setAttribute('aria-controls','schedule'); b.tabIndex = -1;
  b.addEventListener('click', function(){ studio = k; render(true); });
  el('studios').appendChild(b);
});
/* สาขาที่มีสตูดิโอเดียว — ไม่ต้องมีแท็บให้เลือก ซ่อนแถบนี้ทั้งแถวไป */
if(KEYS.length <= 1){ el('studios').parentElement.hidden = true; }

el('studios').addEventListener('keydown', function(e){
  const cur = KEYS.indexOf(document.activeElement.dataset ? document.activeElement.dataset.k : '');
  if(cur < 0) return;
  let n = -1;
  if(e.key === 'ArrowRight') n = (cur + 1) % KEYS.length;
  else if(e.key === 'ArrowLeft') n = (cur - 1 + KEYS.length) % KEYS.length;
  else if(e.key === 'Home') n = 0;
  else if(e.key === 'End') n = KEYS.length - 1;
  if(n < 0) return;
  e.preventDefault();
  studio = KEYS[n]; render(true);
  el('studio-' + KEYS[n]).focus();
});

/* ---------- ปุ่มกรองวัน ---------- */
el('days').addEventListener('click', function(e){
  const b = e.target.closest('.day');
  if(!b) return;
  day = b.dataset.day;
  render(true);
  const again = el('days').querySelector('[data-day="' + day + '"]');
  if(again) again.focus();
});

/* ---------- ความกว้างจอเปลี่ยน ----------
   ใช้ทั้ง matchMedia และ resize เพราะบางเบราว์เซอร์/เฟรมไม่ยิง change ตอนย่อขยาย
   วาดใหม่เฉพาะตอนข้ามเส้น 640px จริง ๆ */
let wasNarrow = narrow.matches;
function onViewportChange(){
  if(narrow.matches === wasNarrow) return;
  wasNarrow = narrow.matches;
  render(false);
}
narrow.addEventListener('change', onViewportChange);
window.addEventListener('resize', onViewportChange);
/* ResizeObserver จับการเปลี่ยนกล่องเลย์เอาต์โดยตรง ไม่พึ่ง event ที่อาจไม่ยิง */
if(window.ResizeObserver){
  new ResizeObserver(onViewportChange).observe(document.documentElement);
}

window.addEventListener('popstate', function(e){
  const p = new URLSearchParams(location.search);
  const st = (e.state && e.state.studio) || p.get('studio');
  studio = KEYS.indexOf(st) > -1 ? st : 'studio1';
  day = (e.state && e.state.day) || p.get('day') || 'all';
  render(false);
});

el('branch').insertAdjacentText('beforeend', BRANCH.name);

/* ============================================================
   ธีมสว่าง/มืด — auto ตามระบบเป็นค่าเริ่มต้น กดสลับแล้วจำไว้ใน localStorage
   ============================================================ */
const THEME_KEY = 'galaxy-theme';
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
  '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
  'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
  '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
const prefersLight = window.matchMedia('(prefers-color-scheme: light)');

function effectiveTheme(){
  const explicit = document.documentElement.dataset.theme;
  if(explicit) return explicit;
  return prefersLight.matches ? 'light' : 'dark';
}
function syncThemeUI(){
  const eff = effectiveTheme();
  const btn = el('themeToggle');
  btn.setAttribute('aria-pressed', eff === 'light' ? 'true' : 'false');
  btn.setAttribute('aria-label', eff === 'light' ? 'สลับเป็นโหมดมืด' : 'สลับเป็นโหมดสว่าง');
  btn.innerHTML = (eff === 'light' ? ICON_MOON : ICON_SUN) +
    '<span>' + (eff === 'light' ? 'โหมดมืด' : 'โหมดสว่าง') + '</span>';
  document.getElementById('themeColorMeta').setAttribute('content', eff === 'light' ? '#F7F5FC' : '#0B0A16');
}
function applyTheme(theme){
  if(theme){
    document.documentElement.dataset.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
  } else {
    delete document.documentElement.dataset.theme;
    localStorage.removeItem(THEME_KEY);
  }
  syncThemeUI();
}

try{
  const saved = localStorage.getItem(THEME_KEY);
  if(saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
}catch(e){ /* localStorage อาจถูกปิดไว้ ไม่เป็นไร ใช้ auto ต่อ */ }
syncThemeUI();

el('themeToggle').addEventListener('click', function(){
  applyTheme(effectiveTheme() === 'light' ? 'dark' : 'light');
});
prefersLight.addEventListener('change', function(){
  if(!document.documentElement.dataset.theme) syncThemeUI();   /* อัปเดตเฉพาะตอนยังไม่ได้ override เอง */
});

/* ============================================================
   ส่งออก PDF — บังคับมุมมองตารางสัปดาห์เต็มก่อนพิมพ์เสมอ
   ไม่ว่าจอตอนนั้นจะแคบแค่ไหนหรือกำลังกรองวันอยู่ก็ตาม
   แล้วคืนค่ากลับตามที่ผู้ใช้เห็นอยู่หลังพิมพ์เสร็จ
   ============================================================ */
let printSnapshot = null;
function forcePrintView(){
  printSnapshot = { title: document.title };
  renderWeek(STUDIOS[studio]);   /* เมินตัวแปร day/narrow ไปเลย พิมพ์เต็มสัปดาห์เสมอ */
  document.title = 'Galaxy-' + BRANCH.nameEn + '-' + STUDIOS[studio].title.replace(/\s+/g,'') + '-Sep2026';
}
function restoreAfterPrint(){
  if(!printSnapshot) return;
  document.title = printSnapshot.title;
  printSnapshot = null;
  render(false);
}
window.addEventListener('beforeprint', forcePrintView);
window.addEventListener('afterprint', restoreAfterPrint);
el('printBtn').addEventListener('click', function(){ window.print(); });
el('jpgBtn').addEventListener('click', saveJpg);

/* ============================================================
   ส่งออก JPG — ความกว้าง EXPORT_W px คงที่ ความสูงตามหน้า
   ============================================================ */
const EXPORT_W = 1440;
function _loadH2C(){
  return new Promise(function(res,rej){
    if(window.html2canvas){res();return;}
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload=res; s.onerror=function(){rej();};
    document.head.appendChild(s);
  });
}
async function saveJpg(){
  var btn=el('jpgBtn');
  btn.disabled=true;
  try{ await _loadH2C(); }
  catch(e){
    alert('ต้องการอินเทอร์เน็ตเพื่อโหลด library ครั้งแรก');
    btn.disabled=false; return;
  }
  var prevDay=day;
  day='all';
  renderWeek(STUDIOS[studio]);
  window.scrollTo(0,0);
  await new Promise(function(r){setTimeout(r,250);});
  var bg=getComputedStyle(document.documentElement).getPropertyValue('--void').trim()||'#0B0A16';
  var b=document.body;
  var cvs=await html2canvas(b,{
    scale:EXPORT_W/b.offsetWidth,
    useCORS:true,
    allowTaint:true,
    backgroundColor:bg,
    scrollX:0, scrollY:0,
    width:b.offsetWidth,
    height:b.scrollHeight,
    windowWidth:b.offsetWidth
  });
  day=prevDay;
  render(false);
  var a=document.createElement('a');
  a.download='Galaxy-'+BRANCH.nameEn.replace(/\s+/g,'')+'-Sep2026.jpg';
  a.href=cvs.toDataURL('image/jpeg',0.92);
  a.click();
  btn.disabled=false;
}

const p0 = new URLSearchParams(location.search);
if(KEYS.indexOf(p0.get('studio')) > -1) studio = p0.get('studio');
if(p0.get('day')) day = p0.get('day');
render(false);
</script>
